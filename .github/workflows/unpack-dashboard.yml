name: Publish sanitized dashboard source

on:
  push:
    branches: [main]
    paths:
      - 'jarvis-dashboard-source.zip'

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Expand and publish source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf extracted
          mkdir -p extracted
          unzip -q jarvis-dashboard-source.zip -d extracted
          test -f extracted/jarvis-dashboard/package.json
          rsync -a --exclude='.git' extracted/jarvis-dashboard/ ./
          rm -rf extracted .upload .upload2 .uploadx .uploadz
          rm -f jarvis-dashboard-source.zip
          rm -f .github/workflows/unpack-dashboard.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish sanitized Jarvis Dashboard source'
          git push
