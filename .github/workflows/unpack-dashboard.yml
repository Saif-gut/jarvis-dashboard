name: Publish sanitized dashboard source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/unpack-dashboard.yml'

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct sanitized source safely
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, glob, io, itertools, lzma, os, tarfile

          paths = sorted(glob.glob('.uploadz/part*.txt'))
          if not paths:
              raise SystemExit('No upload chunks found')

          pieces = []
          for path in paths:
              text = ''.join(open(path, encoding='utf-8').read().split())
              opts = [text]
              if len(text) == 20000:
                  opts = [text[:10000], text[10000:], text]
              pieces.append((path, opts))
              print(path, len(text), 'options', [len(x) for x in opts])

          good = None
          for choice in itertools.product(*[opts for _, opts in pieces]):
              joined = ''.join(choice)
              try:
                  raw = base64.b64decode(joined, validate=True)
                  dec = lzma.decompress(raw)
                  with tarfile.open(fileobj=io.BytesIO(dec), mode='r:') as tf:
                      names = tf.getnames()
                      if not any(n.endswith('/package.json') or n == 'package.json' for n in names):
                          continue
                  good = raw
                  print('Recovered valid archive with encoded length', len(joined))
                  break
              except Exception:
                  pass

          if good is None:
              raise SystemExit('Could not recover a valid dashboard archive from uploaded chunks')

          open('dashboard.tar.xz', 'wb').write(good)
          PY

          rm -rf extracted
          mkdir extracted
          tar -xJf dashboard.tar.xz -C extracted

          package_file="$(find extracted -type f -name package.json -not -path '*/node_modules/*' | head -n 1)"
          test -n "$package_file"
          project_root="$(dirname "$package_file")"
          rsync -a --exclude='.git' "$project_root"/ ./

          rm -rf .upload .upload2 .uploadx .uploadz extracted
          rm -f dashboard.tar.xz jarvis-dashboard-source.zip
          rm -f .github/workflows/unpack-dashboard.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish sanitized Jarvis Dashboard source'
          git push
